<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="light">
    <title>EXPREDOM</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;color:#000}
        html,body {width:100%;height:100%;min-height:100%;overflow-x:hidden;padding:16px;position:fixed;top:0;left:0;right:0;bottom:0}
        body::before {content:"";position:fixed;top:0;left:0;width:100vw;height:100vh;background-image:url("bg.png");background-size:cover;background-position:center;background-repeat:no-repeat;background-color:#fff;z-index:-1}
        .header,.login-box,.publish-box,.post-item,.comment-item {background:#fff;border:1px solid #000;border-radius:12px}
        .header {text-align:center;margin-bottom:16px;padding:16px}
        .header p {font-size:20px;font-weight:bold}
        .login-box,.publish-box {padding:16px;margin-bottom:12px}
        input,textarea {width:100%;padding:14px;margin:6px 0;border:1px solid #000;border-radius:8px;font-size:16px;background:#fff}
        button {width:100%;padding:14px;border:1px solid #000;border-radius:8px;background:#fff;font-size:16px;margin-bottom:8px}
        button:disabled {background:#eee;color:#666}
        .post-item {padding:16px;margin-bottom:12px}
        .comment-area {margin-top:12px;padding-top:12px;border-top:1px dashed #000}
        .comment-item {padding:12px;margin:8px 0}
        .footer-tip {text-align:center;margin-top:20px;font-size:14px;color:#333}
        .hide {display:none}
    </style>
</head>
<body>
    <div class="header"><p>EXPREDOM</p></div>
    <div class="login-box" id="loginBox">
        <h3>设置你的昵称（只需一次）</h3>
        <input type="text" id="username" placeholder="输入你的昵称">
        <button onclick="saveUser()">进入空间</button>
    </div>
    <div id="mainPage" class="hide">
        <div class="publish-box">
            <h3>发布新分享</h3>
            <textarea id="publishContent" rows="3" placeholder="记录心情..."></textarea>
            <button id="publishBtn" onclick="addPost()">立即发布</button>
            <button onclick="showMyHistory()">📝 我的历史</button>
            <button onclick="showAllPosts()">🌐 查看全部</button>
        </div>
        <div id="postList"></div>
    </div>
    <div class="footer-tip">ღ 留言仅作者与留言人双方可见</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCp5d6c5qMgVJYWigy6WGa7cSAhQTdRI8s",
            authDomain: "expredom-f600d.firebaseapp.com",
            projectId: "expredom-f600d",
            storageBucket: "expredom-f600d.firebasestorage.app",
            messagingSenderId: "981038975048",
            appId: "1:981038975048:web:3fdc69d5f15298d01d707d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let currentUser = localStorage.getItem("expredom_user");

        // 自动登录
        window.onload = function() {
            if (currentUser) {
                document.getElementById("loginBox").classList.add("hide");
                document.getElementById("mainPage").classList.remove("hide");
                showAllPosts();
            }
        }

        function saveUser() {
            const name = document.getElementById("username").value.trim();
            if (!name) { alert("请输入昵称！"); return; }
            currentUser = name;
            localStorage.setItem("expredom_user", name);
            document.getElementById("loginBox").classList.add("hide");
            document.getElementById("mainPage").classList.remove("hide");
            showAllPosts();
        }

        // 显示全部帖子（后端排序）
        async function showAllPosts() {
            const snapshot = await db.collection("posts").orderBy("createdAt", "desc").get();
            renderPosts(snapshot);
        }

        // ✅ 修复“我的历史”：不依赖后端排序，前端排序，避免索引问题
        async function showMyHistory() {
            const snapshot = await db.collection("posts")
                .where("author", "==", currentUser)
                .get();
            
            // 前端按时间倒序排序，不用后端索引
            const posts = [];
            snapshot.forEach(doc => {
                posts.push({ id: doc.id, data: doc.data() });
            });
            posts.sort((a, b) => {
                const timeA = a.data.createdAt ? a.data.createdAt.toDate() : new Date(a.data.time);
                const timeB = b.data.createdAt ? b.data.createdAt.toDate() : new Date(b.data.time);
                return timeB - timeA;
            });

            const box = document.getElementById("postList");
            box.innerHTML = "";
            posts.forEach(item => {
                const p = item.data;
                const postId = item.id;
                box.innerHTML += `
                <div class="post-item">
                    <div><b>${p.author}</b> · ${p.time}</div>
                    <div style="margin:8px 0">${p.content}</div>
                    <div class="comment-area">
                        <textarea id="cmt_${postId}" placeholder="写下私密留言"></textarea>
                        <button onclick="addComment('${postId}')">发送留言</button>
                        <div id="cmtBox_${postId}"></div>
                    </div>
                </div>`;
                loadComments(postId);
            });
        }

        function renderPosts(snapshot) {
            const box = document.getElementById("postList");
            box.innerHTML = "";
            snapshot.forEach(doc => {
                const p = doc.data();
                const postId = doc.id;
                box.innerHTML += `
                <div class="post-item">
                    <div><b>${p.author}</b> · ${p.time}</div>
                    <div style="margin:8px 0">${p.content}</div>
                    <div class="comment-area">
                        <textarea id="cmt_${postId}" placeholder="写下私密留言"></textarea>
                        <button onclick="addComment('${postId}')">发送留言</button>
                        <div id="cmtBox_${postId}"></div>
                    </div>
                </div>`;
                loadComments(postId);
            });
        }

        // ✅ 永不卡死的发布函数
        function addPost() {
            const btn = document.getElementById("publishBtn");
            const contentInput = document.getElementById("publishContent");
            const content = contentInput.value.trim();

            if (!content) { alert("内容不能为空！"); return; }
            if (btn.disabled) return;

            btn.disabled = true;
            btn.textContent = "发布中...";
            contentInput.value = "";

            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = "立即发布";
            }, 500);

            db.collection("posts").add({
                author: currentUser,
                content: content,
                time: new Date().toLocaleString(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                showAllPosts();
            }).catch(err => {
                console.error("发布失败", err);
            });
        }

        async function addComment(postId) {
            const input = document.getElementById(`cmt_${postId}`);
            const content = input.value.trim();
            if (!content) { alert("留言不能为空！"); return; }
            input.value = "";
            await db.collection("comments").add({ postId, from: currentUser, content });
            loadComments(postId);
        }

        async function loadComments(postId) {
            const snapshot = await db.collection("comments").where("postId", "==", postId).get();
            const box = document.getElementById(`cmtBox_${postId}`);
            box.innerHTML = "";
            snapshot.forEach(doc => {
                const cmt = doc.data();
                if (currentUser === cmt.from || currentUser === getPostAuthor(postId)) {
                    box.innerHTML += `<div class="comment-item">${cmt.from}：${cmt.content}</div>`;
                }
            });
        }

        async function getPostAuthor(postId) {
            const doc = await db.collection("posts").doc(postId).get();
            return doc.data().author;
        }
    </script>
</body>
</html>
