<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="light">
    <title>EXPREDOM</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;color:#000}
        html,body {width:100%;height:100%;min-height:100%;overflow-x:hidden;padding:16px;position:fixed;top:0;left:0;right:0;bottom:0}
        body::before {content:"";position:fixed;top:0;left:0;width:100vw;height:100vh;background-image:url("bg.png");background-size:cover;background-position:center;background-repeat:no-repeat;background-color:#fff;z-index:-1}
        .header,.login-box,.publish-box,.post-item,.comment-item {background:#fff;border:1px solid #000;border-radius:12px}
        .header {text-align:center;margin-bottom:16px;padding:16px}
        .header p {font-size:20px;font-weight:bold}
        .login-box,.publish-box {padding:16px;margin-bottom:12px}
        input,textarea {width:100%;padding:14px;margin:6px 0;border:1px solid #000;border-radius:8px;font-size:16px;background:#fff}
        button {width:100%;padding:14px;border:1px solid #000;border-radius:8px;background:#fff;font-size:16px}
        button:disabled {background:#eee;color:#666}
        .post-item {padding:16px;margin-bottom:12px}
        .comment-area {margin-top:12px;padding-top:12px;border-top:1px dashed #000}
        .comment-item {padding:12px;margin:8px 0}
        .footer-tip {text-align:center;margin-top:20px;font-size:14px;color:#333}
        .hide {display:none}
    </style>
</head>
<body>
    <div class="header"><p>EXPREDOM</p></div>
    <div class="login-box" id="loginBox">
        <h3>请输入昵称登录</h3>
        <input type="text" id="username" placeholder="输入你的昵称">
        <button onclick="login()">进入空间</button>
    </div>
    <div id="mainPage" class="hide">
        <div class="publish-box">
            <h3>发布新分享</h3>
            <textarea id="publishContent" rows="3" placeholder="记录心情..."></textarea>
            <button id="publishBtn" onclick="addPost()">立即发布</button>
        </div>
        <div id="postList"></div>
    </div>
    <div class="footer-tip">ღ留言仅作者与留言人双方可见</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCp5d6c5qMgVJYWigy6WGa7cSAhQTdRI8s",
            authDomain: "expredom-f600d.firebaseapp.com",
            projectId: "expredom-f600d",
            storageBucket: "expredom-f600d.firebasestorage.app",
            messagingSenderId: "981038975048",
            appId: "1:981038975048:web:3fdc69d5f15298d01d707d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let currentUser = "";

        // 登录
        function login() {
            const name = document.getElementById("username").value.trim();
            if (!name) { alert("请输入昵称！"); return; }
            currentUser = name;
            document.getElementById("loginBox").classList.add("hide");
            document.getElementById("mainPage").classList.remove("hide");
            // ✅ 一登录就自动加载所有历史分享
            startListenPosts();
        }

        // ✅【核心修复】实时监听帖子：重进、刷新、别人发都能看见
        function startListenPosts() {
            db.collection("posts").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                const postList = document.getElementById("postList");
                postList.innerHTML = "";
                snapshot.forEach(doc => {
                    const post = doc.data();
                    const postId = doc.id;
                    postList.innerHTML += `
                    <div class="post-item">
                        <div><b>${post.author}</b> · ${post.time}</div>
                        <div style="margin:8px 0">${post.content}</div>
                        <div class="comment-area">
                            <textarea id="cmt_${postId}" placeholder="写下私密留言"></textarea>
                            <button onclick="addComment('${postId}')">发送留言</button>
                            <div id="cmtBox_${postId}"></div>
                        </div>
                    </div>`;
                    listenComments(postId);
                });
            });
        }

        // ✅ 发布（本地秒响应）
        function addPost() {
            const btn = document.getElementById("publishBtn");
            const contentInput = document.getElementById("publishContent");
            const content = contentInput.value.trim();

            if (!content) { alert("内容不能为空！"); return; }
            if (btn.disabled) return;

            btn.disabled = true;
            btn.textContent = "发布中...";
            contentInput.value = "";

            db.collection("posts").add({
                author: currentUser,
                content: content,
                time: new Date().toLocaleString(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(err => {
                alert("发布失败：" + err.message);
            }).finally(() => {
                btn.disabled = false;
                btn.textContent = "立即发布";
            });
        }

        // 留言
        async function addComment(postId) {
            const input = document.getElementById(`cmt_${postId}`);
            const content = input.value.trim();
            if (!content) { alert("留言不能为空！"); return; }
            input.value = "";
            await db.collection("comments").add({ postId, from: currentUser, content });
        }

        // 实时留言
        function listenComments(postId) {
            db.collection("comments").where("postId", "==", postId).onSnapshot(snapshot => {
                const box = document.getElementById(`cmtBox_${postId}`);
                box.innerHTML = "";
                snapshot.forEach(doc => {
                    const cmt = doc.data();
                    box.innerHTML += `<div class="comment-item">${cmt.from}：${cmt.content}</div>`;
                });
            });
        }
    </script>
</body>
</html>
